name: Build kernel (stone 5.4 + Droidspaces backports)

# Taruh file ini di: .github/workflows/build-kernel.yml pada FORK repo kernel kamu.
# Jalankan dari tab Actions -> "Build kernel ..." -> Run workflow.
#
# Tips: centang "patch_only" untuk hanya menguji penerapan patch (sekitar 1 menit),
# tanpa memasang toolchain dan tanpa build.

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig relatif terhadap arch/arm64/configs (kosong = deteksi otomatis *stone*)"
        required: false
        default: "moonstone_defconfig"
      apply_backports:
        description: "Terapkan Droidspaces/droidspaces-backports (kernel-5.4-series)"
        type: boolean
        default: true
      patch_only:
        description: "Hanya terapkan patch lalu berhenti (tanpa toolchain dan build)"
        type: boolean
        default: false
      relax_context:
        description: "Kalau patch gagal, coba ulang dengan konteks dilonggarkan (git am -C2/-C1)"
        type: boolean
        default: true
      skip_patches:
        description: "Paksa lewati patch tertentu, pisahkan spasi (contoh: 0005 0006)"
        required: false
        default: ""
      container_configs:
        description: "Aktifkan CONFIG dasar untuk container/systemd"
        type: boolean
        default: true
      disable_lto:
        description: "Matikan LTO/CFI/ShadowCallStack (build lebih cepat, aman untuk clang dari apt)"
        type: boolean
        default: true
      clang_url:
        description: "URL tarball clang kustom (opsional, kosong = clang bawaan Ubuntu)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      KMAKE_ARGS: >-
        O=out ARCH=arm64 LLVM=1
        CROSS_COMPILE=aarch64-linux-gnu-
        CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    steps:
      - name: Checkout source kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ambil droidspaces-backports
        if: ${{ inputs.apply_backports }}
        run: |
          git clone --depth 1 https://github.com/Droidspaces/droidspaces-backports "$RUNNER_TEMP/backports"

      - name: Probe kernel dan terapkan patch (kernel-5.4-series)
        if: ${{ inputs.apply_backports }}
        env:
          SKIP_PATCHES: ${{ inputs.skip_patches }}
          RELAX_CONTEXT: ${{ inputs.relax_context }}
        run: |
          set -euo pipefail
          BP="$RUNNER_TEMP/backports"
          SER="$BP/kernel-5.4-series"
          PROBE="$RUNNER_TEMP/probe.txt"
          DIAG="$RUNNER_TEMP/patch-diagnostics.txt"
          APPLIED_DIFF="$RUNNER_TEMP/applied.diff"
          : > "$DIAG"

          git config user.name  "kernel-ci"
          git config user.email "kernel-ci@localhost"
          BASE_SHA="$(git rev-parse HEAD)"

          echo "== Probe =="
          bash "$BP/tools/probe-kernel.sh" "$GITHUB_WORKSPACE" 2>&1 | tee "$PROBE" || true

          # patch -> fitur yang dicek probe (0007 khusus x86, tidak dipakai di arm64)
          declare -A FEATURE=(
            [0001]="STATX_MNT_ID"
            [0002]="STATX_ATTR_MOUNT_ROOT"
            [0003]="utimensat_AT_EMPTY_PATH"
            [0004]="faccessat2"
            [0005]="close_range"
            [0006]="close_range"
          )

          # Coba terapkan satu patch. Mengisi METHOD dengan cara yang berhasil.
          # Skrip edit fs/open.c untuk faccessat2. Dipakai sebagai fallback patch 0004
          # kalau konteks fs/open.c berbeda (hook KernelSU/vendor di do_faccessat).
          OPEN_C_PY="$RUNNER_TEMP/faccessat2_open_c.py"
          cat > "$OPEN_C_PY" <<'PYEOF'
          #!/usr/bin/env python3
          """Tambahkan faccessat2 ke fs/open.c (kernel 5.4) tanpa bergantung pada konteks patch.

          Gaya sama dengan backport Droidspaces: blok credential override tidak diubah,
          AT_EACCESS melompat melewatinya dengan `goto retry`, dan `out:` hanya
          mengembalikan credential kalau override memang dipasang.

          Aman terhadap hook vendor/KernelSU di dalam do_faccessat(). Kalau ada anchor yang
          tidak ditemukan persis satu kali, skrip berhenti tanpa mengubah file.
          """
          import re
          import sys


          def die(msg):
              print("ERROR:", msg, file=sys.stderr)
              sys.exit(1)


          def sub1(text, old, new, what):
              n = text.count(old)
              if n != 1:
                  die("anchor '%s' ditemukan %d kali (harus 1)" % (what, n))
              return text.replace(old, new)


          if len(sys.argv) != 2:
              die("pemakaian: faccessat2_open_c.py <fs/open.c>")

          path = sys.argv[1]
          src = open(path, encoding="utf-8").read()

          if "SYSCALL_DEFINE4(faccessat2" in src:
              die("faccessat2 sudah ada di %s" % path)

          head_old = "long do_faccessat(int dfd, const char __user *filename, int mode)\n{"
          start = src.find(head_old)
          if start < 0:
              die("definisi do_faccessat() versi 3 argumen tidak ditemukan")
          end = src.find("\nSYSCALL_DEFINE3(faccessat,", start)
          if end < 0:
              die("SYSCALL_DEFINE3(faccessat, ...) tidak ditemukan")

          func = src[start:end]

          func = sub1(
              func,
              head_old,
              "static long do_faccessat(int dfd, const char __user *filename, int mode, int flags)\n{",
              "kepala fungsi",
          )
          func = sub1(func, "\tconst struct cred *old_cred;\n",
                      "\tconst struct cred *old_cred = NULL;\n", "old_cred")
          func = sub1(func, "\tstruct cred *override_cred;\n",
                      "\tstruct cred *override_cred = NULL;\n", "override_cred")

          # Cek mode: sisipkan validasi flags sebelum, dan penanganan flags sesudahnya.
          # Regex dipakai supaya tidak bergantung pada spasi/tab sebelum komentar.
          pat = re.compile(r"(\tif \(mode & ~S_IRWXO\)[^\n]*\n\t\treturn -EINVAL;\n)")
          if len(pat.findall(func)) != 1:
              die("cek `mode & ~S_IRWXO` tidak ditemukan tepat satu kali")

          PRE = (
              "\tif (flags & ~(AT_EACCESS | AT_SYMLINK_NOFOLLOW | AT_EMPTY_PATH))\n"
              "\t\treturn -EINVAL;\n"
              "\n"
          )
          POST = (
              "\n"
              "\tif (flags & AT_SYMLINK_NOFOLLOW)\n"
              "\t\tlookup_flags &= ~LOOKUP_FOLLOW;\n"
              "\tif (flags & AT_EMPTY_PATH)\n"
              "\t\tlookup_flags |= LOOKUP_EMPTY;\n"
              "\n"
              "\t/* AT_EACCESS: pakai effective ID, jadi lewati override ke real ID */\n"
              "\tif (flags & AT_EACCESS)\n"
              "\t\tgoto retry;\n"
          )
          func = pat.sub(lambda m: PRE + m.group(1) + POST, func)

          func = sub1(
              func,
              "\trevert_creds(old_cred);\n\tput_cred(override_cred);\n\treturn res;\n}",
              "\tif (old_cred) {\n\t\trevert_creds(old_cred);\n\t\tput_cred(override_cred);\n\t}\n\treturn res;\n}",
              "bagian out:",
          )

          src = src[:start] + func + src[end:]

          src = sub1(
              src,
              "\treturn do_faccessat(dfd, filename, mode);\n}\n",
              "\treturn do_faccessat(dfd, filename, mode, 0);\n}\n"
              "\n"
              "SYSCALL_DEFINE4(faccessat2, int, dfd, const char __user *, filename, int, mode,\n"
              "\t\tint, flags)\n"
              "{\n"
              "\treturn do_faccessat(dfd, filename, mode, flags);\n"
              "}\n",
              "SYSCALL faccessat",
          )
          src = sub1(
              src,
              "\treturn do_faccessat(AT_FDCWD, filename, mode);\n",
              "\treturn do_faccessat(AT_FDCWD, filename, mode, 0);\n",
              "SYSCALL access",
          )

          calls = len(re.findall(r"\bdo_faccessat\(", src))
          if calls != 4:  # definisi + faccessat + faccessat2 + access
              die("jumlah pemakaian do_faccessat() tidak terduga: %d (harus 4)" % calls)

          open(path, "w", encoding="utf-8").write(src)
          print("OK: faccessat2 ditambahkan ke", path)
          PYEOF

          # Fallback 0004: terapkan bagian patch selain fs/open.c, lalu edit fs/open.c lewat skrip.
          apply_faccessat2_fallback() {
            local p="$1"
            if ! git am --exclude=fs/open.c "$p"; then
              git am --abort || true
              return 1
            fi
            if ! python3 "$OPEN_C_PY" fs/open.c; then
              git reset -q --hard HEAD~1
              return 1
            fi
            git add fs/open.c
            git commit -q --amend --no-edit
          }

          METHOD=""
          try_apply() {
            local p="$1" num="$2" c
            METHOD=""
            if git am "$p"; then return 0; fi
            git am --abort || true
            if [ "$num" = "0004" ]; then
              echo "Coba ulang: patch tanpa fs/open.c + edit fs/open.c lewat skrip"
              if apply_faccessat2_fallback "$p"; then METHOD="skrip-open.c"; return 0; fi
            fi
            if [ "$RELAX_CONTEXT" = "true" ]; then
              for c in 2 1; do
                echo "Coba ulang dengan konteks dilonggarkan (-C$c)"
                if git am -C"$c" "$p"; then METHOD="-C$c"; return 0; fi
                git am --abort || true
              done
            fi
            echo "Coba ulang dengan --3way"
            if git am --3way "$p"; then METHOD="3way"; return 0; fi
            git am --abort || true
            return 1
          }

          # Cetak info untuk mendiagnosis patch yang gagal.
          diagnose() {
            local p="$1"
            {
              echo "===== Patch gagal: $(basename "$p") ====="
              echo "--- git apply --check -v ---"
              git apply --check -v "$p" 2>&1 || true
              echo "--- hunk yang ditolak (git apply --reject) ---"
              git apply --reject --whitespace=nowarn "$p" 2>&1 || true
              find . -name '*.rej' -not -path './.git/*' -print -exec cat {} \; || true
              git reset -q --hard HEAD
              find . \( -name '*.rej' -o -name '*.orig' \) -not -path './.git/*' -delete || true
              if grep -q '^+++ b/fs/open.c' "$p"; then
                echo "--- fs/open.c baris 380-520 ---"
                nl -ba fs/open.c | sed -n '380,520p'
                echo "--- hook ksu/susfs/sdcardfs di fs/open.c ---"
                grep -nEi 'ksu|susfs|sdcardfs' fs/open.c || echo "(tidak ada)"
              fi
            } 2>&1 | tee -a "$DIAG"
          }

          APPLIED=""
          SKIPPED=""
          RELAXED=""
          for n in 0001 0002 0003 0004 0005 0006; do
            patch="$(compgen -G "$SER/${n}-*.patch" | head -n1 || true)"
            if [ -z "$patch" ]; then
              echo "::error::Patch $n tidak ditemukan di $SER"
              exit 1
            fi
            name="$(basename "$patch")"

            if [[ " $SKIP_PATCHES " == *" $n "* ]]; then
              echo "SKIP  $name (diminta manual)"; SKIPPED="$SKIPPED $n(manual)"; continue
            fi
            if grep -qiE "${FEATURE[$n]}.*(^|[^a-z])yes" "$PROBE"; then
              echo "SKIP  $name (probe: ${FEATURE[$n]} sudah yes)"; SKIPPED="$SKIPPED $n(probe)"; continue
            fi
            if git apply --reverse --check "$patch" 2>/dev/null; then
              echo "SKIP  $name (sudah terpasang)"; SKIPPED="$SKIPPED $n(terpasang)"; continue
            fi

            echo "APPLY $name"
            if try_apply "$patch" "$n"; then
              if [ -n "$METHOD" ]; then
                APPLIED="$APPLIED $n($METHOD)"
                RELAXED="$RELAXED $n"
                echo "::warning::Patch $n tidak lewat jalur standar (metode: $METHOD). Periksa hasilnya di ringkasan job / artifact applied.diff."
              else
                APPLIED="$APPLIED $n"
              fi
            else
              diagnose "$patch"
              {
                echo "### Patch $n gagal"
                echo '```'
                cat "$DIAG"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Patch $name gagal. Lihat ringkasan job / artifact patch-info, atau Documentation/Porting.md di droidspaces-backports. Bisa juga rerun dengan skip_patches."
              git diff "$BASE_SHA"..HEAD > "$APPLIED_DIFF" || true
              exit 1
            fi
          done

          git diff "$BASE_SHA"..HEAD > "$APPLIED_DIFF" || true

          {
            echo "### Droidspaces backports"
            echo "- Diterapkan: ${APPLIED:-tidak ada}"
            echo "- Dilewati: ${SKIPPED:-tidak ada}"
            echo "- Patch 0007 (x86) tidak dipakai"
            if [ -n "$RELAXED" ]; then
              echo "- PERHATIAN: patch$RELAXED tidak lewat jalur standar (lihat metode di atas). Periksa diff di bawah."
            fi
            echo
            git diff --stat "$BASE_SHA"..HEAD | sed 's/^/    /'
            echo
            if [ -n "$RELAXED" ]; then
              echo '<details><summary>Diff fs/open.c</summary>'
              echo
              echo '```diff'
              git diff "$BASE_SHA"..HEAD -- fs/open.c
              echo '```'
              echo '</details>'
              echo
            fi
            echo '<details><summary>Output probe</summary>'
            echo
            echo '```'
            cat "$PROBE"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload info patch
        if: ${{ always() && inputs.apply_backports }}
        uses: actions/upload-artifact@v4
        with:
          name: patch-info-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/probe.txt
            ${{ runner.temp }}/applied.diff
            ${{ runner.temp }}/patch-diagnostics.txt
          if-no-files-found: ignore

      - name: Bebaskan ruang disk
        if: ${{ !inputs.patch_only }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          df -h /

      - name: Pasang dependensi build
        if: ${{ !inputs.patch_only }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            python3 cpio lz4 xz-utils zstd zip unzip git curl \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Pakai clang kustom (opsional)
        if: ${{ !inputs.patch_only && inputs.clang_url != '' }}
        env:
          CLANG_URL: ${{ inputs.clang_url }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/toolchain/clang"
          curl -fsSL "$CLANG_URL" -o "$RUNNER_TEMP/clang.tar"
          tar -xf "$RUNNER_TEMP/clang.tar" -C "$HOME/toolchain/clang"
          CLANG_BIN="$(dirname "$(find "$HOME/toolchain/clang" -type f -name clang -path '*/bin/*' | head -n1)")"
          echo "Clang kustom: $CLANG_BIN"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Versi toolchain
        if: ${{ !inputs.patch_only }}
        run: |
          clang --version | head -n1
          ld.lld --version | head -n1
          llvm-ar --version | head -n1
          aarch64-linux-gnu-gcc --version | head -n1
          arm-linux-gnueabi-gcc --version | head -n1

      - name: Tentukan defconfig
        if: ${{ !inputs.patch_only }}
        env:
          INPUT_DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -euo pipefail
          CFGDIR=arch/arm64/configs
          cfg="$INPUT_DEFCONFIG"

          if [ -n "$cfg" ]; then
            if [ ! -f "$CFGDIR/$cfg" ]; then
              echo "::error::$CFGDIR/$cfg tidak ada. Daftar defconfig:"
              (cd "$CFGDIR" && find . -type f | sed 's|^\./||' | sort)
              exit 1
            fi
          else
            mapfile -t cands < <(cd "$CFGDIR" && find . -type f -iname '*stone*' | sed 's|^\./||' | sort)
            if [ "${#cands[@]}" -eq 0 ]; then
              echo "::error::Tidak ada defconfig yang cocok dengan *stone*. Isi input 'defconfig'. Daftar:"
              (cd "$CFGDIR" && find . -type f | sed 's|^\./||' | sort)
              exit 1
            elif [ "${#cands[@]}" -eq 1 ]; then
              cfg="${cands[0]}"
            else
              for c in moonstone_defconfig stone_defconfig vendor/stone_defconfig; do
                for x in "${cands[@]}"; do [ "$x" = "$c" ] && cfg="$c"; done
              done
              if [ -z "$cfg" ]; then
                echo "::error::Ada beberapa kandidat, pilih satu lewat input 'defconfig':"
                printf '  %s\n' "${cands[@]}"
                exit 1
              fi
            fi
          fi

          echo "Defconfig: $cfg"
          echo "DEFCONFIG=$cfg" >> "$GITHUB_ENV"

      - name: Konfigurasi kernel
        if: ${{ !inputs.patch_only }}
        env:
          CONTAINER_CONFIGS: ${{ inputs.container_configs }}
          DISABLE_LTO: ${{ inputs.disable_lto }}
        run: |
          set -euo pipefail
          make $KMAKE_ARGS "$DEFCONFIG"

          if [ "$DISABLE_LTO" = "true" ]; then
            ./scripts/config --file out/.config \
              -d LTO_CLANG -d THINLTO -d CFI_CLANG -d CFI_PERMISSIVE \
              -d SHADOW_CALL_STACK -d CC_WERROR -e LTO_NONE
          fi

          # Baseline umum untuk container + systemd. Daftar resmi Droidspaces:
          # jalankan `droidspaces check` di perangkat dan tambahkan yang masih merah.
          WANT="NAMESPACES UTS_NS IPC_NS USER_NS PID_NS NET_NS
                CGROUPS CGROUP_PIDS CGROUP_DEVICE CGROUP_FREEZER CGROUP_CPUACCT
                CGROUP_SCHED CPUSETS MEMCG CGROUP_BPF BPF_SYSCALL
                DEVTMPFS TMPFS TMPFS_XATTR TMPFS_POSIX_ACL
                FHANDLE AUTOFS4_FS SECCOMP SECCOMP_FILTER
                POSIX_MQUEUE SYSVIPC OVERLAY_FS
                CRYPTO_USER_API_HASH IKCONFIG IKCONFIG_PROC"

          if [ "$CONTAINER_CONFIGS" = "true" ]; then
            for c in $WANT; do ./scripts/config --file out/.config -e "$c"; done
          fi

          make $KMAKE_ARGS olddefconfig

          if [ "$CONTAINER_CONFIGS" = "true" ]; then
            echo "== Cek config yang diminta =="
            MISSING=""
            for c in $WANT; do
              if ! grep -qE "^CONFIG_${c}=(y|m)$" out/.config; then
                MISSING="$MISSING $c"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "::warning::Tidak aktif setelah olddefconfig (mungkin tidak ada di kernel ini):$MISSING"
            fi
            echo "- Config diminta tapi tidak aktif:${MISSING:- tidak ada}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build kernel
        if: ${{ !inputs.patch_only }}
        run: |
          set -euo pipefail
          make $KMAKE_ARGS -j"$(nproc)" 2>&1 | tee build.log
          make $KMAKE_ARGS -s kernelrelease | tee kernelrelease.txt

      - name: Kumpulkan hasil build
        if: ${{ !inputs.patch_only }}
        run: |
          set -euo pipefail
          OUT=out/arch/arm64/boot
          mkdir -p dist/dtbs
          for f in Image Image.gz Image.gz-dtb Image.lz4 Image.lz4-dtb dtbo.img; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" dist/
          done
          find "$OUT/dts" -type f \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp {} dist/dtbs/ \; 2>/dev/null || true
          cp out/.config dist/config
          cp kernelrelease.txt dist/
          [ -f "$RUNNER_TEMP/probe.txt" ] && cp "$RUNNER_TEMP/probe.txt" dist/probe.txt || true
          [ -f "$RUNNER_TEMP/applied.diff" ] && cp "$RUNNER_TEMP/applied.diff" dist/applied.diff || true

          if ! ls dist/Image* >/dev/null 2>&1; then
            echo "::error::Tidak ada file Image di $OUT"
            exit 1
          fi
          ls -lh dist dist/dtbs
          echo "- Kernel: $(cat kernelrelease.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hasil build
        if: ${{ !inputs.patch_only }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-stone-5.4-droidspaces-${{ github.run_number }}
          path: dist/
          if-no-files-found: error

      - name: Upload log build (jika gagal)
        if: ${{ failure() && !inputs.patch_only }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            build.log
          if-no-files-found: ignore
